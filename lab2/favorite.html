<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Favorites - Book Explorer</title>
  <link href="./style.css" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-900">

  <nav class="bg-emerald-800 p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-white tracking-wide">Book Explorer</h1>
        <ul class = "flex space-x-6 tex-white font-medium">
                <li><a href = "index.html" class = "hover:text-green-50 transition"> home</a> </li>
                <li><a href = "#" class = "hover:text-green-50 transition"> favorites</a> </li>
                <li><a href = "#" class = "hover:text-green-50 transition"> class</a> </li>
                <li><a href = "#" class = "hover:text-green-50 transition"> subject</a> </li>
                <li><a href = "#" class = "hover:text-green-0 transition"> teachers</a> </li>
        </ul>
    </div>
  </nav>

  <header class="bg-green-50 py-12 text-center border-b border-green-200">
    <div class="max-w-4xl mx-auto px-4">
      <h2 class="text-3xl font-extrabold mb-2 text-green-900">Your Saved Books</h2>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full">
    <!-- Notice the ID here. The DOM will use this ID to insert HTML -->
    <div id="favorites-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- JavaScript will inject favorite books here -->
    </div>
  </main>

  <footer class="bg-emerald-800 text-white text-center py-6 mt-auto">
    <p class="text-sm">&copy; 2026 Book Explorer. All rights reserved.</p>
  </footer>

  <!-- Link the JavaScript file as a module -->
  <script type="module" src="./main.js"></script>
</body>
</html>
